# Stack de PRODUCTION Plume (VPS + Docker Compose).
# ⚠️ Brouillon prêt à l'emploi — à VALIDER au 1er déploiement (TLS réel, migrations, flux cookie).
# Secrets : copier api/.env.prod.example -> api/.env.local (sur le serveur, gitignoré) et remplir.
# Lancement : docker compose -f compose.prod.yaml up -d --build
name: plume

# RÔLE BASE PAR PROCESSUS (ADR-0023) — symétrique du dev (cf. compose.yaml) :
#   - app / worker / worker_io  → rôle RUNTIME `plume_app`, SOUMIS à la RLS (2e ligne de défense
#     fail-closed : hors tenant, aucune ligne n'est visible).
#   - scheduler, migrations, console → rôle PROPRIÉTAIRE : maintenance CROSS-TENANT par conception
#     (énumération des tenants, purges globales, INSERT…SELECT) ; contourne la RLS.
# Docker Compose applique les env_file dans l'ordre : le SECOND écrase `DATABASE_URL` du premier.
# Sans `.env.runtime.local`, la stack ne démarre pas — et le garde-fou HTTP refuserait de servir
# avec une connexion privilégiée (RlsRuntimeRoleGuard), plutôt que de tourner sans isolation.
x-owner-env: &owner-env
  env_file:
    - ./api/.env.local

x-runtime-env: &runtime-env
  env_file:
    - ./api/.env.local
    - ./api/.env.runtime.local

services:
  database:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plume
      POSTGRES_USER: plume
      # POSTGRES_PASSWORD vient de api/.env.local (= mot de passe du rôle propriétaire `plume`).
    env_file:
      - ./api/.env.local
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plume"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped
    # Pas d'exposition réseau : la base n'est jointe que par les autres conteneurs.

  app:
    image: plume-app
    build:
      context: .
      dockerfile: Dockerfile.prod
    <<: *runtime-env
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - caddy-data:/data          # certificats Let's Encrypt persistés
      - jwt-keys:/app/config/jwt   # clés JWT (générées une fois, survivent aux rebuilds)
      # `var/` porte le cache Symfony ET les exports RGPD (APP_SHARE_DIR) : sans volume, un
      # redéploiement effacerait une archive d'export en cours de téléchargement, et le cache
      # gonflerait la couche d'écriture du conteneur.
      - app-var:/app/var
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  worker:
    image: plume-app
    command: ["php", "bin/console", "messenger:consume", "async", "-vv", "--time-limit=3600"]
    healthcheck:
      disable: true
    <<: *runtime-env
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  worker_io:
    image: plume-app
    command: ["php", "bin/console", "messenger:consume", "io", "-vv", "--time-limit=3600"]
    healthcheck:
      disable: true
    <<: *runtime-env
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

  # Exemplaire UNIQUE (ne pas répliquer) — rôle propriétaire, fan-out cross-tenant.
  scheduler:
    image: plume-app
    command: ["php", "bin/console", "messenger:consume", "scheduler_default", "-vv"]
    healthcheck:
      disable: true
    <<: *owner-env
    depends_on:
      database:
        condition: service_healthy
    restart: unless-stopped

volumes:
  db-data:
  caddy-data:
  jwt-keys:
  app-var:
