framework:
    cache:
        # Store du cache applicatif ET des rate-limiters (les limiteurs s'appuient sur `cache.app`).
        # Adapter choisi par paramètre (compile-time — un env dynamique est refusé ici par Symfony).
        # Défaut : filesystem (mono-hôte, dev/CI/VPS mono-instance). En déploiement MULTI-INSTANCES,
        # basculer `app.cache_adapter` sur `cache.adapter.redis` (+ REDIS_DSN) pour que les compteurs
        # de rate-limiting soient PARTAGÉS entre instances — sinon chaque instance a son propre seau
        # et la limite effective est multipliée par le nombre d'instances (V2.0-c, hébergement agnostique).
        app: '%app.cache_adapter%'
        default_redis_provider: '%env(REDIS_DSN)%'
