# Back-office (ROLE_ADMIN — cf. access_control) : vue d'ensemble, comptes, actions support.
api_admin_overview:
    path: /api/v1/admin/overview
    controller: App\Admin\Infrastructure\Http\AdminOverviewController
    methods: [GET]

api_admin_accounts:
    path: /api/v1/admin/accounts
    controller: App\Admin\Infrastructure\Http\AdminAccountsController
    methods: [GET]

api_admin_accounts_export:
    path: /api/v1/admin/accounts/export
    controller: App\Admin\Infrastructure\Http\AdminAccountsExportController
    methods: [GET]

api_admin_audit:
    path: /api/v1/admin/audit
    controller: App\Admin\Infrastructure\Http\AdminAuditController
    methods: [GET]

# Abonnement (V2.2) : checkout + portail (authentifiés), webhook Stripe (public, signé).
api_billing_subscription:
    path: /api/v1/billing/subscription
    controller: App\Billing\Infrastructure\Http\SubscriptionStatusController
    methods: [GET]

api_billing_checkout:
    path: /api/v1/billing/checkout
    controller: App\Billing\Infrastructure\Http\CheckoutController
    methods: [POST]

api_billing_portal:
    path: /api/v1/billing/portal
    controller: App\Billing\Infrastructure\Http\PortalController
    methods: [POST]

api_billing_webhook:
    path: /api/v1/billing/webhook
    controller: App\Billing\Infrastructure\Http\StripeWebhookController
    methods: [POST]

api_admin_alerts:
    path: /api/v1/admin/alerts
    controller: App\Admin\Infrastructure\Http\AdminAlertsController
    methods: [GET]

api_admin_billing:
    path: /api/v1/admin/billing
    controller: App\Admin\Infrastructure\Http\AdminBillingController
    methods: [GET]

api_admin_account_comp:
    path: /api/v1/admin/accounts/{tenantId}/comp
    controller: App\Admin\Infrastructure\Http\AdminCompController
    methods: [POST]
    requirements:
        tenantId: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'

api_admin_trends:
    path: /api/v1/admin/trends
    controller: App\Admin\Infrastructure\Http\AdminTrendsController
    methods: [GET]

api_admin_status:
    path: /api/v1/admin/status
    controller: App\Admin\Infrastructure\Http\AdminStatusController
    methods: [GET]

api_admin_metrics:
    path: /api/v1/admin/metrics
    controller: App\Admin\Infrastructure\Http\AdminMetricsController
    methods: [GET]

api_admin_account_detail:
    path: /api/v1/admin/accounts/{tenantId}
    controller: App\Admin\Infrastructure\Http\AdminAccountDetailController
    methods: [GET]
    requirements:
        tenantId: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'

api_admin_account_request_deletion:
    path: /api/v1/admin/accounts/{tenantId}/request-deletion
    controller: App\Admin\Infrastructure\Http\AdminRequestAccountDeletionController
    methods: [POST]
    requirements:
        tenantId: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'

api_admin_account_reset_2fa:
    path: /api/v1/admin/accounts/{tenantId}/reset-2fa
    controller: App\Admin\Infrastructure\Http\AdminResetTwoFactorController
    methods: [POST]
    requirements:
        tenantId: '[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}'

# Valeur estimée d'une piste (authentifié) : action dédiée (pas de PATCH générique sur le pipeline).
api_lead_estimated_value:
    path: /api/v1/leads/{id}/estimated-value
    controller: App\Prospecting\Infrastructure\Http\SetEstimatedValueController
    methods: [PATCH]

# Export CSV du tableau de bord (authentifié).
api_dashboard_export:
    path: /api/v1/dashboard/export
    controller: App\Prospecting\Infrastructure\Http\DashboardExportController
    methods: [GET]

# Annuaire suggéré (authentifié) : catalogue de cibles de référence + ajout au Répertoire.
api_directory_catalog:
    path: /api/v1/directory/catalog
    controller: App\Directory\Infrastructure\Http\CatalogController
    methods: [GET]

api_directory_catalog_import:
    path: /api/v1/directory/catalog/import
    controller: App\Directory\Infrastructure\Http\ImportCatalogEntryController
    methods: [POST]

# Sonde de santé (PUBLIC) pour l'hébergeur / le monitoring.
api_health:
    path: /api/v1/health
    controller: App\Shared\Infrastructure\Http\HealthController
    methods: [GET]

api_login_check:
    path: /api/v1/login_check

api_token_refresh:
    path: /api/v1/token/refresh

# Révocation d'un refresh token (appelé au logout par le front).
api_token_invalidate:
    path: /api/v1/token/invalidate
    controller: App\Account\Infrastructure\Http\InvalidateRefreshTokenController
    methods: [POST]

# Identité de la session (le front ne peut plus lire le JWT : cookie httpOnly, M2.0).
api_me:
    path: /api/v1/me
    controller: App\Account\Infrastructure\Http\MeController
    methods: [GET]

# Changement du mot de passe de l'utilisateur courant (page Compte).
api_account_password:
    path: /api/v1/account/password
    controller: App\Account\Infrastructure\Http\ChangePasswordController
    methods: [POST]

# Inscription publique (PUBLIC) : crée un compte non vérifié + envoie l'email de vérification.
api_register:
    path: /api/v1/register
    controller: App\Account\Infrastructure\Http\RegisterController
    methods: [POST]

# Vérification d'email (PUBLIC) : confirme l'adresse via le jeton signé.
api_account_verify_email:
    path: /api/v1/account/verify-email
    controller: App\Account\Infrastructure\Http\VerifyEmailController
    methods: [POST]

# Renvoi de l'email de vérification (PUBLIC, anti-énumération) — compte non confirmé.
api_account_verify_email_resend:
    path: /api/v1/account/verify-email/resend
    controller: App\Account\Infrastructure\Http\ResendVerificationController
    methods: [POST]

# Mot de passe oublié (PUBLIC) : demande de lien de réinitialisation.
api_account_password_forgot:
    path: /api/v1/account/password/forgot
    controller: App\Account\Infrastructure\Http\ForgotPasswordController
    methods: [POST]

# Mot de passe oublié (PUBLIC) : réinitialisation via jeton.
api_account_password_reset:
    path: /api/v1/account/password/reset
    controller: App\Account\Infrastructure\Http\ResetPasswordController
    methods: [POST]

# 2FA TOTP (page Compte) : statut, enrôlement en deux temps, désactivation (mot de passe exigé).
api_account_2fa_status:
    path: /api/v1/account/2fa
    controller: App\Account\Infrastructure\Http\TwoFactorController::status
    methods: [GET]
api_account_2fa_setup:
    path: /api/v1/account/2fa/setup
    controller: App\Account\Infrastructure\Http\TwoFactorController::setup
    methods: [POST]
api_account_2fa_confirm:
    path: /api/v1/account/2fa/confirm
    controller: App\Account\Infrastructure\Http\TwoFactorController::confirm
    methods: [POST]
api_account_2fa_disable:
    path: /api/v1/account/2fa/disable
    controller: App\Account\Infrastructure\Http\TwoFactorController::disable
    methods: [POST]

# Sessions actives (refresh tokens) : liste, révocation unitaire, tout sauf la courante.
# SOUS /api/v1/token/ : le cookie httpOnly `refresh_token` est PATH-RESTREINT à /api/v1/token
# (M2.0) — c'est le seul endroit où le serveur peut le lire pour identifier la session COURANTE.
# Firewall `api` (JWT) : seul /token/refresh a son firewall dédié.
api_account_sessions:
    path: /api/v1/token/sessions
    controller: App\Account\Infrastructure\Http\SessionsController::list
    methods: [GET]
api_account_session_revoke:
    path: /api/v1/token/sessions/{id}
    controller: App\Account\Infrastructure\Http\SessionsController::revoke
    methods: [DELETE]
    requirements:
        id: '\d+'
api_account_sessions_revoke_others:
    path: /api/v1/token/sessions/revoke-others
    controller: App\Account\Infrastructure\Http\SessionsController::revokeOthers
    methods: [POST]

# RGPD : suppression du compte courant (soft-delete + purge différée).
api_account_delete:
    path: /api/v1/account
    controller: App\Account\Infrastructure\Http\DeleteAccountController
    methods: [DELETE]

# RGPD : export de toutes les données du compte (archive ZIP : JSON + CSV).
api_account_export:
    path: /api/v1/account/export
    controller: App\Account\Infrastructure\Http\ExportAccountController
    methods: [GET]
